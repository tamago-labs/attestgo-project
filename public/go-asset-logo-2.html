<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GO — Option 2 Monogram</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#EBEDEF] flex items-center justify-center p-8">
<div class="w-[500px] h-[500px] bg-[#0A0A0F] flex flex-col items-center justify-center relative overflow-hidden">
  <!-- subtle grain -->
  <div class="absolute inset-0 opacity-[0.04]" style="background-image:radial-gradient(#fff 1px,transparent 1px);background-size:18px 18px"></div>
  <!-- mark -->
  <div class="relative w-[108px] h-[108px] flex items-center justify-center">
    <div class="absolute inset-0 rounded-[26px] bg-white"></div>
    <!-- interlocked GO -->
    <div class="relative flex items-center">
      <span class="text-[#0A0A0F] text-[38px] font-[600] tracking-[-0.06em] leading-none" style="font-family:'Space Grotesk',sans-serif">G</span>
      <span class="text-[#0A0A0F] text-[38px] font-[500] tracking-[-0.06em] leading-none -ml-[3px]">O</span>
      <span class="absolute -right-[5px] top-[14px] w-[6px] h-[6px] rounded-full bg-[#C8A96A]"></span>
    </div>
  </div>
  <div class="mt-7 text-center relative">
    <div class="text-[15px] tracking-[0.22em] font-[600] text-white">GO ASSET MANAGEMENT</div>
    <div class="mt-1.5 text-[10px] tracking-[0.2em] text-white/40 uppercase">Nikkei 225 & T-Bill</div>
  </div>
  <div class="absolute bottom-[22px] left-1/2 -translate-x-1/2 text-[8px] tracking-[0.2em] text-white/25 uppercase">02 — Monogram</div>
</div>
</body>
</html>
