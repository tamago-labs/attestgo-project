<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GO Asset Management — Option 2 · Shield Verified</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{font-family:Inter,system-ui,sans-serif}.display{font-family:'Space Grotesk',sans-serif}</style>
</head>
<body class="min-h-screen bg-[#0A0A12] flex flex-col items-center justify-center p-8 gap-6">
<p class="text-xs tracking-[0.2em] text-white/30 uppercase">Option 2 · Shield Verified — 500×500 · compliance angle</p>
<div class="w-[500px] h-[500px] bg-[#0F0F19] rounded-[32px] border border-white/[0.07] shadow-[0_24px_64px_rgba(0,0,0,0.6)] flex flex-col items-center justify-center p-10 relative overflow-hidden">
  <!-- glow -->
  <div class="absolute -top-28 left-1/2 -translate-x-1/2 w-[520px] h-[320px] bg-[#7C5CFF]/[0.16] blur-[80px] rounded-full"></div>
  <div class="absolute inset-0 opacity-[0.06]" style="background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:44px 44px"></div>
  <!-- shield -->
  <div class="relative mt-2">
    <div class="w-[176px] h-[196px] relative flex items-center justify-center">
      <!-- shield shape -->
      <svg viewBox="0 0 176 196" class="absolute inset-0 w-full h-full" fill="none">
        <path d="M88 4 L162 38 L162 108 C162 148 128 176 88 192 C48 176 14 148 14 108 L14 38 Z" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.11" stroke-width="1.2"/>
        <path d="M88 12 L154 42 L154 108 C154 142 124 168 88 182 C52 168 22 142 22 108 L22 42 Z" stroke="#7C5CFF" stroke-opacity="0.22" stroke-width="1" fill="none"/>
      </svg>
      <!-- GO inside shield -->
      <div class="relative flex flex-col items-center">
        <div class="flex items-center gap-[1px] -mb-1">
          <span class="display text-[58px] font-[700] tracking-[-0.03em] text-white">G</span>
          <span class="display text-[58px] font-[300] tracking-[-0.03em] text-white/90 -ml-1">O</span>
        </div>
        <!-- verified check badge -->
        <div class="w-7 h-7 rounded-full bg-[#22C55E] flex items-center justify-center shadow-[0_6px_16px_rgba(34,197,94,0.5)] mt-1">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        </div>
      </div>
    </div>
  </div>
  <div class="mt-6 text-center relative">
    <div class="display text-[21px] font-[600] tracking-[-0.02em] text-white">GO Asset Management</div>
    <div class="mt-1.5 text-[10px] tracking-[0.22em] text-white/35 uppercase font-medium">Verified Issuer · AttestGO</div>
    <div class="mt-3 flex items-center justify-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-[#22C55E]"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-[#7C5CFF]"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-white/20"></span>
    </div>
  </div>
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-[9px] tracking-[0.14em] text-white/20 uppercase">500 × 500 · Trust</div>
</div>
<p class="text-xs text-white/45 text-center max-w-[500px] leading-5">Angle: attest/verify. Shield + green check reinforces <b>GOPass compliance</b> — ideal for RWA token badge overlay.</p>
</body>
</html>
