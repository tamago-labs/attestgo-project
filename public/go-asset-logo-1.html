<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GO Asset Management — Option 1 · Monogram Institutional</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{font-family:Inter,system-ui,sans-serif}.display{font-family:'Space Grotesk',sans-serif}</style>
</head>
<body class="min-h-screen bg-[#F5F3EF] flex flex-col items-center justify-center p-8 gap-6">
<p class="text-xs tracking-[0.2em] text-black/40 uppercase">Option 1 · Monogram Institutional — 500×500 · export to PNG/SVG</p>
<div class="w-[500px] h-[500px] bg-white rounded-[32px] shadow-[0_24px_64px_rgba(0,0,0,0.08),0_1px_0_rgba(0,0,0,0.04)] flex flex-col items-center justify-center p-10 relative overflow-hidden">
  <!-- subtle grid -->
  <div class="absolute inset-0 opacity-[0.03]" style="background-image:linear-gradient(#000 1px,transparent 1px),linear-gradient(90deg,#000 1px,transparent 1px);background-size:40px 40px"></div>
  <!-- top accent line -->
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-24 h-[3px] bg-[#C8A96A] rounded-full"></div>
  <!-- monogram -->
  <div class="relative w-[220px] h-[220px] flex items-center justify-center">
    <!-- outer ring -->
    <div class="absolute inset-0 rounded-full border-[1.5px] border-black/[0.08]"></div>
    <div class="absolute inset-[10px] rounded-full border border-black/[0.04]"></div>
    <!-- GO -->
    <div class="flex items-center gap-[2px] select-none">
      <span class="display text-[92px] font-[700] tracking-[-0.04em] leading-none text-[#0A0A0F]">G</span>
      <span class="display text-[92px] font-[300] tracking-[-0.04em] leading-none text-[#0A0A0F]/90 -ml-[2px]">O</span>
    </div>
    <!-- gold dot accent -->
    <div class="absolute -right-1 top-1/2 -translate-y-1/2 w-[9px] h-[9px] rounded-full bg-[#C8A96A]"></div>
    <!-- inner gold arc -->
    <svg class="absolute inset-0 w-full h-full -rotate-[18deg]" viewBox="0 0 220 220" fill="none"><circle cx="110" cy="110" r="99" stroke="#C8A96A" stroke-width="1.2" stroke-dasharray="42 260" stroke-linecap="round" opacity="0.9"/></svg>
  </div>
  <div class="mt-7 text-center relative">
    <div class="display text-[22px] font-[600] tracking-[-0.02em] text-[#0A0A0F]">GO Asset Management</div>
    <div class="mt-1.5 text-[10px] tracking-[0.24em] text-black/40 uppercase font-medium">Nikkei 225 · T-Bill · Onchain</div>
    <div class="mt-3 mx-auto w-10 h-px bg-[#C8A96A]/60"></div>
  </div>
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-[9px] tracking-[0.14em] text-black/25 uppercase">500 × 500 · Institutional</div>
</div>
<p class="text-xs text-black/50 text-center max-w-[500px] leading-5">Angle: premium bank monogram. <b>Use:</b> website header, fund factsheet, token icon center. Download: screenshot the white card at 500×500 or copy SVG below.</p>
</body>
</html>
