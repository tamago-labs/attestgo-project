<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AttestGO Brand - Light Background</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 500px; height: 500px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .logo { display: flex; align-items: baseline; gap: 6px; }
    .attest { font-size: 48px; font-weight: 600; color: #0A0D13; letter-spacing: -1px; }
    .go { display: inline-flex; align-items: center; background: linear-gradient(135deg, #FDB750 0%, #8B7CF0 100%); color: #0A0D13; padding: 0.25em 0.6em; border-radius: 0; font-weight: 700; letter-spacing: 0.08em; font-size: 24px; }
  </style>
</head>
<body>
  <div class="logo">
    <span class="attest">attest</span>
    <span class="go">GO</span>
  </div>
</body>
</html>
