<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GO — Option 3 Arch</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#EBEDEF] flex items-center justify-center p-8">
<div class="w-[500px] h-[500px] bg-white flex flex-col items-center justify-center relative">
  <div class="absolute inset-[18px] border border-[#0A0A0F]/[0.06] pointer-events-none rounded-[20px]"></div>
  <!-- emblem -->
  <div class="w-[72px] h-[72px] rounded-full border border-[#0A0A0F]/10 flex items-center justify-center relative">
    <div class="w-[52px] h-[52px] rounded-full bg-[#0A0A0F] flex items-center justify-center">
      <span class="text-white text-[19px] font-[600] tracking-[-0.04em]" style="font-family:'Space Grotesk',sans-serif">GO</span>
    </div>
    <!-- arch -->
    <div class="absolute -top-[1px] left-1/2 -translate-x-1/2 w-[44px] h-[22px] overflow-hidden">
      <div class="w-[44px] h-[44px] rounded-full border border-[#C8A96A]/70"></div>
    </div>
    <div class="absolute -top-[2px] left-1/2 -translate-x-1/2 w-[6px] h-[6px] rounded-full bg-[#C8A96A]"></div>
  </div>
  <div class="mt-5 text-center">
    <div class="text-[18px] font-[500] tracking-[-0.03em] text-[#0A0A0F]" style="font-family:'Cormorant Garamond',serif">Go Asset Management</div>
    <div class="mt-1 text-[11px] tracking-[0.2em] font-[500] text-black/40 uppercase" style="font-family:Inter,sans-serif">Asset Management</div>
  </div>
  <div class="absolute bottom-[22px] left-1/2 -translate-x-1/2 text-[8px] tracking-[0.2em] text-black/20 uppercase">03 — Arch Emblem</div>
</div>
</body>
</html>
