<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GO Asset Management — Option 3 · Growth Horizon</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{font-family:Inter,system-ui,sans-serif}.display{font-family:'Space Grotesk',sans-serif}</style>
</head>
<body class="min-h-screen bg-[#F8FAFC] flex flex-col items-center justify-center p-8 gap-6">
<p class="text-xs tracking-[0.2em] text-black/35 uppercase">Option 3 · Growth Horizon — 500×500 · asset growth angle</p>
<div class="w-[500px] h-[500px] bg-white rounded-[32px] border border-black/[0.06] shadow-[0_20px_60px_rgba(15,23,42,0.08)] flex flex-col items-center justify-center p-10 relative overflow-hidden">
  <!-- horizon gradient -->
  <div class="absolute bottom-0 inset-x-0 h-[180px] bg-gradient-to-t from-[#0F172A]/[0.06] to-transparent"></div>
  <div class="absolute top-0 inset-x-0 h-px bg-gradient-to-r from-transparent via-[#0EA5E9]/30 to-transparent"></div>
  <!-- mark -->
  <div class="relative w-[210px] h-[150px] flex items-end justify-center gap-[5px]">
    <!-- bars / horizon steps -->
    <div class="w-[36px] h-[38px] rounded-t-[6px] bg-[#E2E8F0]"></div>
    <div class="w-[36px] h-[58px] rounded-t-[6px] bg-[#CBD5E1]"></div>
    <div class="w-[36px] h-[86px] rounded-t-[6px] bg-[#0F172A] relative overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-t from-[#0F172A] to-[#334155]"></div>
      <!-- GO cutout -->
      <div class="absolute inset-0 flex items-center justify-center">
        <span class="display text-[22px] font-[700] tracking-[-0.02em] text-white">GO</span>
      </div>
    </div>
    <div class="w-[36px] h-[112px] rounded-t-[6px] bg-[#0EA5E9] relative">
      <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 rounded-full bg-[#0EA5E9] border-[3px] border-white shadow"></div>
    </div>
    <!-- growth arrow -->
    <svg class="absolute -top-6 right-[36px] w-[88px] h-[38px]" viewBox="0 0 88 38" fill="none"><path d="M2 30 L26 18 L46 24 L72 4" stroke="#0EA5E9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0"/><path d="M62 4 L72 4 L72 14" stroke="#0EA5E9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="mt-7 text-center relative">
    <div class="display text-[22px] font-[700] tracking-[-0.03em] text-[#0F172A]">GO Asset Management</div>
    <div class="mt-1 text-[11px] font-[500] text-[#64748B] tracking-[-0.01em]">Nikkei 225 & T-Bill — Onchain</div>
    <div class="mt-3 inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#F1F5F9] border border-[#E2E8F0]">
      <span class="w-2 h-2 rounded-full bg-[#0EA5E9] animate-pulse"></span>
      <span class="text-[10px] tracking-[0.14em] font-[600] text-[#0F172A] uppercase">Markets Open</span>
    </div>
  </div>
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-[9px] tracking-[0.14em] text-black/25 uppercase">500 × 500 · Growth</div>
</div>
<p class="text-xs text-black/50 text-center max-w-[500px] leading-5">Angle: performance / AUM growth. Bars → horizon chart; <b>GO</b> anchored on strongest bar. Ideal for DeFi dashboard & factsheet header.</p>
</body>
</html>
